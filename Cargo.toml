[package]
name = "systeminfo-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.0"
tokio = {version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
